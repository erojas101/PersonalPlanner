<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <title>Planner de Gastos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <nav class="tabs" id="tabs">
      <div class="brand">Planner</div>
      <button data-view="resumen"><span class="ico">◎</span><span>Resumen</span></button>
      <button data-view="movimientos"><span class="ico">≡</span><span>Movimientos</span></button>
      <button data-view="presupuesto"><span class="ico">◧</span><span>Presupuesto</span></button>
      <button data-view="importar"><span class="ico">⇣</span><span>Importar</span></button>
      <button data-view="ajustes"><span class="ico">⚙</span><span>Ajustes</span></button>
      <div class="sync" id="sync-status"></div>
    </nav>
    <main id="main"><p class="muted pad">Cargando…</p></main>
  </div>
  <dialog id="dialog"></dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
